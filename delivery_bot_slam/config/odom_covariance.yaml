# Build path: task 4.4 in docs/slam_build_path.md
# odom_covariance_relay: rewrite rf2o's empty twist covariance so the EKF can
# use it. rf2o (b38c68e) leaves twist.covariance at zero, and
# robot_localization turns a zero measurement variance into 1e-9, which makes
# the scan-matching yaw rate look perfect and drowns the IMU's 4e-4.
#
# twist.covariance is row-major 6x6: index 0 is vx, index 35 is vyaw.
# Everything else is 1e3, meaning "unknown, do not fuse".

odom_covariance_relay:
  ros__parameters:
    input_topic: /odom_rf2o
    output_topic: /odom_rf2o_cov

    # CALIBRATE (m^2/s^2): dedicated calibration run -- drive a measured
    # straight line, compare rf2o vx against it, set the squared residual;
    # starting point 1e-3 (sd ~0.03 m/s).
    vx_variance: 1.0e-3

    # CALIBRATE (rad/s)^2: same run while turning, compare rf2o vyaw against
    # the IMU and set this a few times the IMU's 4e-4 so the gyro leads the
    # fusion; 4e-3 is sd ~0.06 rad/s.
    vyaw_variance: 4.0e-3

    # Not measured: 1e3 means "no information". ekf.yaml's two_d_mode already
    # skips vy, vz, roll and pitch.
    unused_variance: 1.0e3

    # Never fit either variance on an evaluation run: the number would then
    # describe that run, not the sensor.
