name: CI

# What this can and cannot prove:
#   can:  the four packages build against Jazzy, the URDF is valid xacro, every
#         YAML config parses, flake8 and pep257 pass on delivery_bot_slam,
#         delivery_bot_drivers and delivery_bot_mission (description and bringup
#         have no lint tests).
#   cannot: lidar rate, IMU noise, motor direction, TF at runtime — those need
#         the Pi and are recorded by hand in docs/test_log.md.
#
# Private repo: each run is ~4 GitHub Actions minutes against the 2000/month
# free tier, so keep it to one job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rules a markdown file cannot enforce. Seconds, no ROS, runs on PRs only.
  repo-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'PR title is type, date, then what'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^[a-z]+(\([a-z0-9_-]+\))?: [0-9]{4}-[0-9]{2}-[0-9]{2} .+' \
            || { echo "::error::title must look like 'docs: 2026-11-02 what changed'"; exit 1; }

      - name: notes.md and evidence/ are append-only
        run: |
          base="origin/${{ github.base_ref }}"
          removed=$(git diff --numstat "$base"...HEAD -- notes/notes.md | awk '{print $2}')
          [ "${removed:-0}" = 0 ] || { echo "::error::notes/notes.md lost $removed line(s); it is append-only"; exit 1; }
          changed=$(git diff --diff-filter=MDR --name-only "$base"...HEAD -- evidence/)
          [ -z "$changed" ] || { echo "::error::evidence/ is append-only, modified: $changed"; exit 1; }

      - name: Code changes carry a test or a test-log row
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          base="origin/${{ github.base_ref }}"
          files=$(git diff --diff-filter=AM --name-only "$base"...HEAD -- 'delivery_bot_*/*.py' 'tools/*.py')
          code=$(echo "$files" | grep -Ev '(^|/)(test|tests)/|/setup\.py$|/__init__\.py$|/resource/' || true)
          [ -n "$code" ] || exit 0
          tests=$(git diff --name-only "$base"...HEAD | grep -E '(^|/)(test|tests)/.*\.py$|^docs/test_log\.md$' || true)
          [ -z "$tests" ] || exit 0
          echo "$BODY" | grep -q 'no-test:' && exit 0
          echo "::error::code changed with no test and no docs/test_log.md row: $code"
          echo "::error::add one, or write 'no-test: <reason>' in the PR description"
          exit 1

      - name: No dry_run:=false added
        run: |
          if git diff -U0 "origin/${{ github.base_ref }}"...HEAD -- . ':!*.md' ':!.github' \
              | grep -E '^\+' | grep -Ei 'dry_run(:=|=| *: *)(false|0)'; then
            echo "::error::live motors are a deliberate act on the Pi, not a committed default (AGENTS rule 1)"
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install build dependencies for vendored explore_lite
        run: |
          # explore_lite compiles against nav2_msgs, nav2_costmap_2d and map_msgs.
          # setup-ros installs ros-base only, so without this the vendored package
          # fails in the build step for a reason that has nothing to do with us.
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-navigation2 ros-jazzy-nav2-bringup

      - name: Assemble workspace (repo + pinned deps.repos)
        run: |
          mkdir -p "$HOME/ws/src"
          cp -r "$GITHUB_WORKSPACE" "$HOME/ws/src/delivery_bot"
          cd "$HOME/ws/src"
          vcs import . < delivery_bot/deps.repos

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          cd "$HOME/ws"
          # m-explore-ros2 also ships multirobot_map_merge, which we never run; skipping it keeps its unused deps out of the build.
          colcon build --symlink-install --event-handlers console_cohesion+ \
            --packages-skip multirobot_map_merge

      - name: Validate URDF and YAML
        run: |
          # setup-ros installs ros-base, which has neither xacro nor PyYAML.
          sudo apt-get install -y ros-jazzy-xacro python3-yaml liburdfdom-tools > /dev/null
          source /opt/ros/jazzy/setup.bash
          source "$HOME/ws/install/setup.bash"
          xacro "$HOME/ws/src/delivery_bot/delivery_bot_description/urdf/delivery_bot.urdf.xacro" > /tmp/robot.urdf
          check_urdf /tmp/robot.urdf
          python3 - <<'PY'
          import glob, os, sys, yaml
          root = os.path.expanduser("~/ws/src/delivery_bot")
          paths = glob.glob(os.path.join(root, "**", "*.yaml"), recursive=True)
          if not paths:
              sys.exit("no YAML found — glob is broken")
          for path in paths:
              with open(path) as handle:
                  yaml.safe_load(handle)
              print("ok", path)
          PY

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          # The config and launch tests look up other packages' share directories, and
          # colcon test alone does not put them on AMENT_PREFIX_PATH.
          source "$HOME/ws/install/setup.bash"
          cd "$HOME/ws"
          # multirobot_map_merge is never built (see above), so it cannot be tested.
          # explore_lite is pinned third-party code: its own flake8/uncrustify/xmllint
          # tests fail at that commit and are not ours to fix. The build step above is
          # what proves it compiles on Jazzy; our packages are tested in full.
          colcon test --event-handlers console_cohesion+ \
            --packages-skip multirobot_map_merge explore_lite
          colcon test-result --verbose
