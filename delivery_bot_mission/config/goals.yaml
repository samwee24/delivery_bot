# Named goals in the map frame.
#
# Do not hand-edit coordinates unless you have no choice: put the robot where it
# should stand and save the pose instead:
#
#   ros2 run delivery_bot_mission save_goal --ros-args \
#     -p goals_file:=$HOME/ros2_ws/src/delivery_bot/delivery_bot_mission/config/goals.yaml \
#     seat_1
#
# home is the taped start mark and the return target of every delivery.
# Moved 2026-11-10 from (0, 0) (0.21 m to the nearest obstacle) to 0.67 m clearance
# (results/maps/2026-11-10_home_clearance.png). Keep in step with amcl.yaml
# initial_pose and navigation.launch.py map_start_pose (test_config_consistency).

home:
  x: -1.3
  y: -0.3
  yaw: 2.635  # 151 deg from map +x, parallel to the walls either side (map fit)
