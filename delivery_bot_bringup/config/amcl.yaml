# AMCL for the E3 localiser comparison (localizer:=amcl in navigation.launch.py).
# Every value below is *brief default* (not tuned); anything unlisted is Nav2's default.
# The robot starts on the taped home mark, home in goals.yaml (-1.3, -0.3, yaw 2.635 = 151 deg, since 2026-11-10).
amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    set_initial_pose: true
    initial_pose:
      x: -1.3
      y: -0.3
      z: 0.0
      yaw: 2.635
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_d: 0.05
    update_min_a: 0.1
