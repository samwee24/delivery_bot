# AMCL for the E3 localiser comparison (localizer:=amcl in navigation.launch.py).
# Every value below is *brief default* (not tuned); anything unlisted is Nav2's default.
# The robot starts on the taped home mark, which is 0, 0, 0 in goals.yaml.
amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_d: 0.05
    update_min_a: 0.1
