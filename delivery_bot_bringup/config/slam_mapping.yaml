# FROZEN 2026-10-31 after the 5.5 sweep (results in docs/test_log.md): none of the five
# variants beat these values, so they stay as they are (values unchanged since commit 923d415).
# Do not change them between evaluation runs; a change needs a new sweep and a new date here.
# Copied from slam_toolbox (Jazzy) config/mapper_params_online_async.yaml,
# then edited for this robot. Provenance of each edit is in the comment.
# Source package version on the Pi: 2.8.5.

slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # Huber rather than None: one wrong loop closure otherwise drags the whole
    # trajectory. Keep this fixed across every experiment — changing the robust
    # kernel between runs changes what is being compared (docs/slam.md §3.5).
    ceres_loss_function: HuberLoss

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint        # this robot has no base_link tf for Nav2 use
    scan_topic: /scan
    use_map_saver: true
    mode: mapping                     # mapping mode: build the map

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    # 5 s normally. explore.launch.py overrides this to 2.0 so frontiers and the
    # Foxglove map refresh faster while the robot maps on its own.
    map_update_interval: 5.0
    resolution: 0.05                  # 5 cm cells, matches nav2 costmaps
    restamp_tf: false
    # 0.15 not 0.0: the A1's own minimum range. Anything closer is the robot's
    # own mast or standoffs, which would otherwise be mapped as walls.
    min_laser_range: 0.15
    max_laser_range: 8.0              # A1M8 measured max useful range ~8.5 m
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    # RViz-only feature (click to add scan nodes). Foxglove cannot use it, and it
    # costs Pi CPU during a mapping run.
    enable_interactive_mode: false

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # Small room, slow robot: accept a node every 10 cm / 0.1 rad.
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
