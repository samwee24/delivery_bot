# robot_localization EKF (2D).
#
# Fused inputs, deliberately minimal:
#   * rf2o, via the covariance relay: forward speed (vx) + yaw rate only — its
#     x/y position drifts and is not worth trusting; the EKF integrates the
#     velocity itself.
#   * MPU6050: yaw rate only. No accelerometer (too noisy on this cheap board)
#     and no absolute yaw (no magnetometer, so there is nothing absolute to trust).
#
# odom0 is /odom_rf2o_cov, NOT /odom_rf2o. rf2o at the pinned commit b38c68e
# publishes twist covariance filled with zeros, and robot_localization replaces a
# zero variance with 1e-9 — which makes rf2o's yaw rate look perfect and leaves
# the gyro with almost no influence. delivery_bot_slam's odom_covariance_relay
# rewrites that diagonal first. See docs/slam.md §3.2.
#
# The EKF is the only publisher of odom -> base_footprint; rf2o runs with
# publish_tf: false.

ekf_filter_node:
  ros__parameters:
    frequency: 20.0   # was 30; "Failed to meet update rate" under camera load
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom_rf2o_cov
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0_config: [false, false, false, false, false, false,
                   true,  false, false, false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 5

    imu0: /imu/data
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 10
