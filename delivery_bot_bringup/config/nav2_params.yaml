# Derived from the ROS 2 Jazzy nav2_bringup default nav2_params.yaml
# (downloaded 2026-10-22), then edited for this robot:
#   * robot_base_frame -> base_footprint, odom -> /odometry/filtered
#   * robot_radius 0.12 (measured 2026-10-31, approx), inflation 0.25
#   * controller 10 Hz, RPP replacing MPPI, 0.15 m/s cap, 10 cm goal tolerance
#   * velocity smoother clamped to the same envelope
#   * Collision Monitor: 0.20 m x +-35 deg stop wedge on /scan
#   * enable_stamped_cmd_vel: true on every node that sends or takes velocity
#     commands, so /cmd_vel is TwistStamped (motor_node and teleop -p stamped:=true)
# AMCL is removed: slam_toolbox localization provides map + map->odom.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 1000   # ms; 20 aborted goals when the planner was busy (load 18), 2026-11-10
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # Jazzy defaults to plain Twist; motor_node subscribes TwistStamped (2026-11-09)
    enable_stamped_cmd_vel: true
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 3.14  # any final heading; the end-of-goal turn stalled, 2026-11-10
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15            # matches the motor cap, never raise casually
      lookahead_dist: 0.25
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.4
      lookahead_time: 1.5
      transform_tolerance: 0.5            # 0.1 gave TF_ERROR (extrapolation into the future) at load 12-18, 2026-11-10
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.10  # wheel floor 0.10 m/s (duty 0.12), 2026-11-10
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.10  # wheel floor 0.10 m/s (duty 0.12), 2026-11-10
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.6  # x 0.078 m half-track = 0.125 m/s per wheel; 1.0 (0.078) stalled turning in place, 2026-11-10
      rotate_to_heading_min_angle: 1.05   # 60 deg: bigger errors turn in place
      max_angular_accel: 3.2  # 1.0 ramped through the stall band
      allow_reversing: false  # true (2026-11-10) made it drive backwards to goals; recoveries still back up

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      transform_tolerance: 0.5  # map->odom 0.37 s old at load 16 aborted a goal, default 0.3 (2026-11-10)
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.12
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.12
      transform_tolerance: 0.5  # map->odom 0.37 s old at load 16 aborted a goal, default 0.3 (2026-11-10)
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    # Jazzy defaults to plain Twist; motor_node subscribes TwistStamped (2026-11-09)
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5  # was 0.1; map->odom runs 0.37 s late under load (2026-11-10)
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.6
    min_rotational_vel: 1.4  # 0.4 (0.03 m/s per wheel) spin recovery timed out, 2026-11-10
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

lifecycle_manager_navigation:
  ros__parameters:
    # 2026-11-09: default 4.0 s tripped at load 20-30 ("SERVER smoother_server IS DOWN
    # after not receiving a heartbeat for 4000 ms"), Nav2 went down mid-run. Brief value,
    # not yet measured. nav2_bringup does not pass this file to its lifecycle manager, so
    # navigation.launch.py and explore.launch.py read it and apply it with SetParameter.
    bond_timeout: 10.0

velocity_smoother:
  ros__parameters:
    # Jazzy defaults to plain Twist; motor_node subscribes TwistStamped (2026-11-09)
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 1.6]
    min_velocity: [-0.12, 0.0, -1.6]  # reverse above the 0.10 m/s wheel stall floor, 2026-11-10
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    # Jazzy defaults to plain Twist; motor_node subscribes TwistStamped (2026-11-09)
    enable_stamped_cmd_vel: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5  # 0.2 gave "invalid source" stops (laser->base_footprint too new) at load 30, 2026-11-10
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    # slowdown removed 2026-11-10: 0.3 x 0.15 = 0.045 m/s is under the 0.10 m/s wheel stall floor;
    # a box 0.5 m ahead stalled a goal (12 x Failed to make progress). Block kept below, unlisted.
    polygons: ["stop", "approach"]
    stop:
      type: "polygon"
      action_type: "stop"
      # 0.20 m straight ahead, +-35 deg, in base_footprint. A string because rcl rejects
      # nested lists; [0.20, 0.0] is a collinear 4th vertex because Jazzy's string parser
      # rejects polygons of 3 vertices (`size() <= 3`), the triangle is unchanged.
      points: "[[0.0, 0.0], [0.20, 0.14], [0.20, 0.0], [0.20, -0.14]]"
      visualize: true
      enabled: true
    slowdown:
      type: "polygon"
      action_type: "slowdown"
      # box 0.50 m ahead, +-0.20 m (robot_radius 0.12 + 0.08 margin), ~3 s at 0.15 m/s; default 2026-11-03, not measured
      points: "[[0.0, 0.20], [0.50, 0.20], [0.50, -0.20], [0.0, -0.20]]"
      slowdown_ratio: 0.3  # default 2026-11-03, not measured
      visualize: true
      enabled: true
    approach:
      type: "circle"
      action_type: "approach"
      radius: 0.12  # = local_costmap robot_radius; default 2026-11-03, not measured
      time_before_collision: 1.5  # s; default 2026-11-03, not measured
      simulation_time_step: 0.1  # s; default 2026-11-03, not measured
      visualize: true
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    # Jazzy defaults to plain Twist; motor_node subscribes TwistStamped (2026-11-09)
    enable_stamped_cmd_vel: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
