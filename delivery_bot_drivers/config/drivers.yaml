# Driver parameters. Every value marked MEASURE or "calibrate" is a placeholder.
#
# Pins are flat parameters (ena_pin, in1_pin, ...) because nested YAML dicts are
# awkward to declare in rclpy. BCM numbering, matching the wiring table.

motor_node:
  ros__parameters:
    ena_pin: 12          # left PWM
    in1_pin: 5           # left direction A
    in2_pin: 6           # left direction B
    enb_pin: 13          # right PWM
    in3_pin: 26          # right direction A
    in4_pin: 16          # right direction B
    pwm_hz: 100          # measured 2026-11-09: lgpio software PWM at 1 kHz overshoots under stack load (duty 0.30, 2 s: 0.85 m idle, 1.46 m at 33 runnable threads); 100 Hz gives 0.90 m both ways (test_log)
    wheel_base: 0.156    # measured 2026-10-31, left-right wheel centres (URDF)
    max_duty: 0.85       # never above this, whatever the controller asks
    min_duty: 0.11        #min duty according to tests with 12v voltage
    #dead_zone_left: 0.35   # dont need dead_zone, determined with min duty
    #dead_zone_right: 0.35  # dont need dead_zone, determined with min duty
    gain_left: 0.44       # duty per m/s, fitted 2026-11-09: direct sweep speed = 2.25 x (duty - 0.11); live check 0.30 m/s -> 0.75 m in 2.6 s (test_log)
    gain_right: 0.44      # fitted 2026-11-09, wheels matched (3-8 cm left drift per 0.6-0.85 m)
    min_wheel_speed: 0.01 #min calculated wheel speed
    kick_duty: 0.30      # kick-start from rest: static friction needs ~0.20 duty, 0.15 m/s maps to 0.176 and stalls (test_log 2026-11-09); 0.30 moved 0.85 m in 2 s
    kick_s: 0.15         # kick length, brief default, not measured
    watchdog_s: 0.5
    # lidar stop, brief default (docs/system/05_config_reference.md)
    stop_dist_m: 0.20
    stop_half_angle_deg: 35.0
    scan_timeout_s: 0.5  # no /scan for this long means stop
    # scan angle (laser frame, rad) that points along base +x. Measured, URDF:
    # base_link_to_laser has rpy 0 0 laser_yaw, laser_yaw = 0 (box test 1.4,
    # 2026-10-31), and scan angles are in the laser frame, so forward = -yaw = 0.
    laser_forward_rad: 0.0
    use_gyro_loop: false
    kp_omega: 0.5
    ki_omega: 1.0
    dry_run: true        # the launch file decides; live needs the dry_run launch argument set to false

imu_node:
  ros__parameters:
    bus: 1
    address: 104         # 0x68, written decimal because rclpy ints are decimal
    rate_hz: 100.0
    calib_seconds: 3.0
    calib_max_std: 0.01
    gyro_scale_z: 1.0    # measured 2026-10-31: one 360 deg hand turn, gyro integrated -360.2 deg (0.06 %), docs/test_log.md
    gyro_var: 0.0001     # fitted 2026-10-31, provisional: at rest 1.7e-6 (2 bags, bias removed), x60 margin for motor vibration; recheck with motors running (4.5)
    accel_var: 0.04
